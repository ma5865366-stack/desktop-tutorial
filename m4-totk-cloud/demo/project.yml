name: M4SettingsSmoke
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  M4SettingsSmoke:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../ios/M4Profiles.swift
      - path: ../ios/M4ControlPanel.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.m4totk.smoketest
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        IPHONEOS_DEPLOYMENT_TARGET: '26.0'
        TARGETED_DEVICE_FAMILY: '2'
        SUPPORTS_MACCATALYST: 'NO'
